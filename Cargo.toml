[package]
name = "pds"
version = "1.7.0"
edition = "2024"



[dependencies]
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
ciborium = "0.2.2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
fastcdc = "5.0.0"
hex = "0.4.3"
iroh = "1.5.0"
rand = "0.10.3"
rusqlite = { version = "0.43.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = { version = "3.0.0", features = ["serde"] }
